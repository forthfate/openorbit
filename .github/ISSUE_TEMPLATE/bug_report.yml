name: Bug report
description: Report something in OpenOrbit that is not working as expected.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OpenOrbit. Clear details make it easier to reproduce and fix the issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Briefly describe the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that show the problem.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share relevant versions, operating system, browser, database, or deployment details.
      placeholder: |
        OS:
        Browser:
        Node/Python version:
        Deployment:
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, links, or notes that may help.
    validations:
      required: false
